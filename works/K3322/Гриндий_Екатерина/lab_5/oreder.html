<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ФОРМА ЗАКАЗА</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #5fb9f6, #abf4e9);
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }

        .container {
            background: white;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0px 4px 10px rgba(0, 0, 0, 0.1);
            max-width: 400px;
            width: 100%;
            text-align: center;
        }

        h1 {
            color: #333;
            font-size: 24px;
            margin-bottom: 20px;
        }

        label {
            font-weight: bold;
            display: block;
            text-align: left;
            margin: 10px 0 5px;
        }

        input, select, textarea {
            width: 90%;
            padding: 10px;
            margin-top: 5px;
            border: 2px solid #ddd;
            border-radius: 8px;
            font-size: 16px;
            transition: all 0.3s ease;
        }

        input:focus, select:focus, textarea:focus {
            border-color: #abf4e9;
            outline: none;
            box-shadow: 0px 0px 8px #5fb9f6;
        }

        textarea {
            resize: vertical;
            min-height: 80px;
        }

        .submit-btn {
            background: #5fb9f6;
            color: white;
            border: none;
            padding: 12px;
            width: 100%;
            font-size: 18px;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.3s ease;
            margin-top: 15px;
        }

        .submit-btn:hover {
            background: #4760ff;
            box-shadow: 0px 4px 8px rgba(71, 145, 255, 0.5);
        }
    </style>
</head>
<body>

<div class="container">
    <h1>ФОРМА ПОИСКА ДЕВУШКИ</h1>
    <form action="process_order.php" method="POST">
        <label for="last_name">Фамилия:</label>
        <input type="text" id="last_name" name="last_name" required />

        <label for="first_name">Имя:</label>
        <input type="text" id="first_name" name="first_name" required />

        <label for="address">Город(НЕ СЕЛО):</label>
        <input type="text" id="address" name="address" required />

        <label for="phone">Ник в телеграмме:</label>
        <input type="tel" id="phone" name="phone" required />


        <label for="product">Выберите цвет волос:</label>
        <select id="product" name="product" required>
            <option value="Product 1">Рыжий</option>
            <option value="Product 2">Блонд</option>
            <option value="Product 3">Брюнет</option>
        </select>

        <label for="comment">Расскажи анекдот:</label>
        <textarea id="comment" name="comment"></textarea>

        <input type="submit" value="Отправить" class="submit-btn" />

    </form>

</div>
</body>
</html>
